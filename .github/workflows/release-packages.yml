name: Release packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Resume the launcher publication after all native uploads were accepted in this release run"
        type: string
        required: false
        default: ""
      release_tag:
        description: "Original version tag when resuming (for example v0.1.3)"
        type: string
        required: false
        default: ""
      resume_attempt:
        description: "Automatic continuation count; leave at zero for manual recovery"
        type: number
        required: false
        default: 0
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.resume_run_id }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-14
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            # Support kernels with a 39-bit virtual address space as well.
            features: tsrs_core/plain-ptrs
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            rustflags: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - name: Preserve fixture and patch bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --target ${{ matrix.target }}
      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify release control flow
        run: node --test scripts/npm-registry.test.mjs
      - name: Prepare pinned compiler
        run: npm run setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}-${{ hashFiles('upstream.json', 'patches/**') }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild@0.24.0
          fallback: none
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        if: runner.os == 'Linux'
        with:
          version: 0.13.0
      - name: Build native executable
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features || '' }}
        run: |
          command=build
          [ "$RUNNER_OS" != Linux ] || command=zigbuild
          options=()
          [ -z "$FEATURES" ] || options+=(--features "$FEATURES")
          node scripts/cargo.mjs "$command" --release --locked --target "$TARGET" "${options[@]}"
      - name: Check configuration parity
        env:
          TARGET: ${{ matrix.target }}
        run: |
          extension=
          [ "$RUNNER_OS" != Windows ] || extension=.exe
          npm run verify:config -- --binary "target/$TARGET/release/effect-tsrs$extension"
      - name: Check project selection and default behavior
        env:
          TARGET: ${{ matrix.target }}
        run: |
          extension=
          [ "$RUNNER_OS" != Windows ] || extension=.exe
          npm run verify:project -- --binary "target/$TARGET/release/effect-tsrs$extension"
      - name: Check all 130 rules against the native oracle
        if: matrix.platform == 'darwin-arm64'
        run: |
          npm run fixtures:install
          npm run verify:all -- --binary target/aarch64-apple-darwin/release/effect-tsrs --output artifacts/all-rules/release --jobs 4
      - name: Check Oxlint integration
        env:
          TARGET: ${{ matrix.target }}
        run: |
          extension=
          [ "$RUNNER_OS" != Windows ] || extension=.exe
          node scripts/prepare-oxlint.mjs "target/$TARGET/oxlint"
          npm run verify:oxlint -- --binary "target/$TARGET/release/effect-tsrs$extension"
      - name: Check all 130 rules through the Oxlint protocol
        if: matrix.platform == 'darwin-arm64'
        run: npm run verify:oxlint:all -- --binary target/aarch64-apple-darwin/release/effect-tsrs --output artifacts/verify-oxlint-all --jobs 4
      - name: Pack npm tarballs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          extension=
          [ "$RUNNER_OS" != Windows ] || extension=.exe
          npm run package:release -- --target "$TARGET" --binary "target/$TARGET/release/effect-tsrs$extension"
      - name: Verify installed packages
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(node -p 'require("./package.json").version')
          npm run verify:package -- \
            --package "artifacts/npm/yielded-effect-tsrs-$version.tgz" \
            --platform "artifacts/npm/yielded-effect-tsrs-$PLATFORM-$version.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.platform }}
          path: |
            artifacts/npm/*.tgz
            artifacts/npm/package-*.json
            artifacts/verify-package/
            artifacts/verify-oxlint/report.json
            artifacts/verify-oxlint-all/report.json
            artifacts/verify-config/report.json
            artifacts/verify-project/
            artifacts/verify-config/cases/*/results/**
            artifacts/all-rules/release/report.json
            !artifacts/**/node_modules/**
          if-no-files-found: error
      - name: Retain verification failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-${{ matrix.platform }}
          path: |
            artifacts/all-rules/release/**/*.json
            artifacts/all-rules/release/**/*.stderr.txt
            artifacts/all-rules/release/shard-*.log
            artifacts/verify-config/report.json
            artifacts/verify-config/cases/*/results/**
            artifacts/verify-package/
            artifacts/verify-oxlint/
            artifacts/verify-project/
            artifacts/verify-oxlint-all/**/*.json
            artifacts/verify-oxlint-all/**/*.stderr.txt
            !artifacts/**/node_modules/**
          if-no-files-found: ignore

  publish:
    name: Publish to npm
    needs: build
    if: ${{ always() && ((startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate original release run
        id: resume
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" > "$RUNNER_TEMP/release-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/release-jobs.json"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          const run = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "release-run.json")));
          const { jobs } = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "release-jobs.json")));
          assert.equal(run.event, "push");
          assert.equal(run.path, ".github/workflows/release-packages.yml");
          assert.equal(run.head_branch, process.env.RELEASE_TAG);
          assert.match(run.head_sha, /^[a-f0-9]{40}$/);
          for (const platform of ["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64", "win32-x64"]) {
            const builds = jobs.filter(job => job.name === platform);
            assert.equal(builds.length, 1, `Missing or duplicate build: ${platform}`);
            assert.equal(builds[0].conclusion, "success", `Build did not pass: ${platform}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${run.head_sha}\n`);
          NODE
          source_sha="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/release-run.json")).head_sha')"
          gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$source_sha" > "$RUNNER_TEMP/release-manifest-response.json"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          const response = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "release-manifest-response.json")));
          const contents = Buffer.from(response.content, "base64");
          const manifest = JSON.parse(contents);
          assert.equal(process.env.RELEASE_TAG, `v${manifest.version}`);
          const file = path.join(process.env.RUNNER_TEMP, "release-package.json");
          fs.writeFileSync(file, contents);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest=${file}\n`);
          NODE
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: npm-*
          path: artifacts/release
          run-id: ${{ inputs.resume_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish verified native packages, then the launcher
        id: publish
        env:
          RELEASE_SHA: ${{ steps.resume.outputs.sha || github.sha }}
          RELEASE_MANIFEST: ${{ steps.resume.outputs.manifest }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          options=()
          [ -z "$RESUME_RUN_ID" ] || options+=(--resume)
          set +e
          node scripts/publish-npm.mjs --artifacts artifacts/release "${options[@]}"
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - name: Queue registry continuation
        if: steps.publish.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.resume_run_id || github.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          CONTINUATION_REF: ${{ github.ref_name }}
          RESUME_ATTEMPT: ${{ inputs.resume_attempt || 0 }}
        run: |
          [[ "$RESUME_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
          if [ "$RESUME_ATTEMPT" -ge 35 ]; then
            echo "Registry still pending after 36 checks; native uploads are retained and the launcher remains withheld." >&2
            exit 1
          fi
          gh workflow run release-packages.yml --repo "$GITHUB_REPOSITORY" --ref "$CONTINUATION_REF" \
            -f resume_run_id="$SOURCE_RUN_ID" -f release_tag="$RELEASE_TAG" -f resume_attempt="$((RESUME_ATTEMPT + 1))"
          echo "Registry processing is pending. Queued continuation for $RELEASE_TAG using verified artifacts from run $SOURCE_RUN_ID; native uploads will not be repeated." >> "$GITHUB_STEP_SUMMARY"
